<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Signature Form</title>
    <style>
        canvas#signature {
            border: 1px solid black;
            background: url('Picture1.png') no-repeat center center;
            background-size: 100;
        }

        form>* {
            margin: 10px;
        }
    </style>
</head>
<body>

<form action="submit.php" onsubmit="return onSubmit(this)" method="post">
    <div>
        <canvas id="signature" width="600" height="800"></canvas>
    </div>
    <div>
        <button type="button" onclick="clearSignature()">Clear</button>
    </div>
    <div>
        <input type="hidden" name="signature" />
    </div>
    <!-- <button type="submit">Send</button> -->
</form>

<script>
    var canvas = document.getElementById('signature');
    var ctx = canvas.getContext("2d");
    var drawing = false;
    var prevX, prevY;
    var currX, currY;
    var signature = document.getElementsByName('signature')[0];

    canvas.addEventListener("mousemove", draw);
    canvas.addEventListener("mouseup", stop);
    canvas.addEventListener("mousedown", start);

    function start(e) {
        drawing = true;
    }

    function stop() {
        drawing = false;
        prevX = prevY = null;
        signature.value = canvas.toDataURL();
    }

    function draw(e) {
        if (!drawing) {
            return;
        }

        var rect = canvas.getBoundingClientRect(); // Mendapatkan posisi absolut canvas
        var clientX = e.type === 'touchmove' ? e.touches[0].clientX : e.clientX;
        var clientY = e.type === 'touchmove' ? e.touches[0].clientY : e.clientY;

        // Menghitung posisi mouse relatif terhadap canvas
        currX = clientX - rect.left;
        currY = clientY - rect.top;

        if (!prevX && !prevY) {
            prevX = currX;
            prevY = currY;
        }

        ctx.beginPath();
        ctx.moveTo(prevX, prevY);
        ctx.lineTo(currX, currY);
        ctx.strokeStyle = 'black';
        ctx.lineWidth = 2;
        ctx.stroke();
        ctx.closePath();

        prevX = currX;
        prevY = currY;
    }

    function clearSignature() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        signature.value = "";
        prevX = prevY = null;
    }

    function onSubmit(e) {
        console.log({
            'name': document.getElementsByName('name')[0].value,
            'signature': signature.value,
        });
        return false;
    }
</script>

</body>
</html>
